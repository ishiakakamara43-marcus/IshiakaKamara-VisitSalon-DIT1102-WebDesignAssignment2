<section class="container" aria-label="Destinations">
  <div class="dest-grid">
      <button class="dest-card" type="button" id="freetown" data-dest="freetown" aria-haspopup="dialog">
        <!-- IMAGE 1: Freetown — paste your image URL in src below -->
        <div class="image-container" data-label="Freetown">
          <a href="https://en.wikipedia.org/wiki/Freetown"><img src="https://christoph.today/wp-content/uploads/2022/03/254424229_249112793944809_1433488783991174890_n-1024x756.jpg" alt="Freetown, Sierra Leone" loading="lazy"></a>

        <span class="card-name">Freetown</span>
        <span class="card-cat">City &amp; Culture</span>
      </button>
      <button class="dest-card" type="button" id="turtle-islands" data-dest="turtle-islands" aria-haspopup="dialog">
        <!-- IMAGE 2: Turtle Islands — paste your image URL in src below -->
        <div class="image-container" data-label="Turtle Islands">
          <a href="https://africageographic.com/stories/sierra-leones-turtle-islands-ultimate-digital-detox/"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSu25W52OxO7HD7M6RsfkLv-zs3vm18JRhKaM9gVOz9G4Blxhgb-rxSZ7k&s=10" alt="Turtle Islands, Sierra Leone" loading="lazy"></a>

        <span class="card-cat">Wildlife</span>

      <button class="dest-card" type="button" id="bonthe" data-dest="bonthe" aria-haspopup="dialog">

        </div>
        <span class="card-name">Bonthe</span>
        <span class="card-cat">History</span>
      </button>
      <button class="dest-card" type="button" id="kamberi-hills" data-dest="kamberi-hills" aria-haspopup="dialog">

        <span class="card-cat">Riverside Scenery</span>
      </button>
      <button class="dest-card" type="button" id="tacugama" data-dest="tacugama" aria-haspopup="dialog">

        </div>
        <span class="card-name">Tacugama</span>
        <span class="card-cat">Chimpanzee Viewing &amp; Feeding</span>
      </button>
